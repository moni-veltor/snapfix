5.9639">rootCauseHypothesis : string?</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="14" lengthAdjust="spacing" textLength="178.5273" x="1478.73" y="242.2607">closureCriteriaMet : Json?</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="58" id="ent0006"><path d="M441.39,96.5269 L441.39,143.2269 L406.5,147.2269 L441.39,151.2269 L441.39,197.3238 A0,0 0 0 0 441.39,197.3238 L717.8578,197.3238 A0,0 0 0 0 717.8578,197.3238 L717.8578,106.5269 L707.8578,96.5269 L441.39,96.5269 A0,0 0 0 0 441.39,96.5269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M707.8578,96.5269 L707.8578,106.5269 L717.8578,106.5269 L707.8578,96.5269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="255.4678" x="447.39" y="113.5938">Write-only stream. No update or delete</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="236.9136" x="447.39" y="128.7266">path. /audit renders with URL-driven</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="241.103" x="447.39" y="143.8594">filters; /api/audit/export streams CSV</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="238.1641" x="447.39" y="158.9922">up to 50k rows. Every mutation calls</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="239.2305" x="447.39" y="174.125">audit() &#8212; failures are caught so they</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="184.7295" x="447.39" y="189.2578">never break the user action.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="67" id="ent0009"><path d="M1159.27,111.6669 L1159.27,143.2269 L1124.95,147.2269 L1159.27,151.2269 L1159.27,182.1981 A0,0 0 0 0 1159.27,182.1981 L1423.9819,182.1981 A0,0 0 0 0 1423.9819,182.1981 L1423.9819,121.6669 L1413.9819,111.6669 L1159.27,111.6669 A0,0 0 0 0 1159.27,111.6669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1413.9819,111.6669 L1413.9819,121.6669 L1423.9819,121.6669 L1413.9819,111.6669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="234.1523" x="1165.27" y="128.7338">Regulator-evidence-mode exercises</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="243.7119" x="1165.27" y="143.8666">hash-chain audit writes so a reviewer</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="213.3511" x="1165.27" y="158.9994">can re-walk the chain offline and</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="231.3911" x="1165.27" y="174.1322">detect tampering. Exercise-scoped.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="74" id="ent0012"><path d="M1530.79,309.5669 L1530.79,395.2309 A0,0 0 0 0 1530.79,395.2309 L1776.4653,395.2309 A0,0 0 0 0 1776.4653,395.2309 L1776.4653,319.5669 L1766.4653,309.5669 L1657.63,309.5669 L1653.63,249.9669 L1649.63,309.5669 L1530.79,309.5669 A0,0 0 0 0 1530.79,309.5669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1766.4653,309.5669 L1766.4653,319.5669 L1776.4653,319.5669 L1766.4653,309.5669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="220.7969" x="1536.79" y="326.6338">Real-world incident declared from</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="191.1406" x="1536.79" y="341.7666">inside or outside an exercise.</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="187.7827" x="1536.79" y="356.8994">Drives RegulatorNotification,</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="224.6753" x="1536.79" y="372.0322">RecoveryPlan, PostIncidentReport,</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="211.9419" x="1536.79" y="387.165">RunbookExecution attachments.</text></g><?plantuml-src bLNRSjis47tNL-oeBubhIhxKyZHDqc5qgTIHPO_jDCyGkH8n1W465obiqau_eb_OB-akICkIqywqVf0NksU1FMSNO25pX4pQJ66dOBj4NvZSTTo3r9MmeWGbDVgwGZ2MGdi1LuZSRALUmqeeXtkH75SYA3ynsYz4YT2TQO_s65pjF9P9a6GAxHA7LgwwUucfjMOxDCfO-6PmFXXCJlU2gBtqDNpk0BmJsSFQcg3p5Zo9VnmnDaVRUeUNexF9cBnJ5EJzAciydfp5h2REzRQHyylpa_IS8dk-aydfvLbAljHxAvV1urxmkykBYy7tpuDtybU4qzFERvqErQuGNg_82nddl6aFUNjqb8PSUb1c3T-29AdMbeWU7RtkC_fjfzCoxqRStAp7sjkw2y91Eezw7CaSNe6Za_MQbad2FcFNimEtoBonUwuV0Vfzq44fUDFsXZ7Iw0PCnWuReV7yj0a4pRylVX-Sm4QeWEub9NbXr-ZlULeE4hjowRhm1ReRrBcnqRH1BurvOBlNw-sIz-iZfmjbAMnzk5qkNQL4ZJcf1Nt1LH6KHbVamWl2_koCvkpCel2Ofvvy8xBkPOdSZ4T1nv_GPj9X93OLhdXIbbV_hYssYOS2E_n8I-eWsPN5JTnZB-uBwGvyaStTD4tEBWPWDcXZ6ar19MfbHCxxD5PBwZzmckcCBhBsaGKj_iU0_1CjbZ77J0dx_Cmd_xlwkGv4XOjvHPSsb97b_Fe3TVfgF9gzlo9ZEljfIl-6jxFxsJ2TSv8NFhXTIaowlXal67Mzk4zdY_68xVdrtNZ4EYZXd5p9J1mCAjThZV534HnEwyhu0frq1_5C6HSi3gb6gbDSeT_D30cfZKUmSbruC2k8jNrWP6AqgdaN56KF5WP2HUF6xo89eT1Zx9OlUkr8WgLXH-jWAtq1xs_dIMubNG22hQIYazqFXAnaW-xZfufUs7P_1yExNmWOAl06BauUYDFMzM1CmjPG1j-GpeHIZYyhx_3Y9Vprnv_q64j5v1nGPmWGc8SpD7jO4r9pQs19Ppom2qWaszxr7erG3ip-kGOyivHxY-kW1BqX2Mvun39CIaFVZCUfuKeAWYPP8UXYDY9iMJh75GWIP2DnYvPR83GjawrGJHrDYbcj-7C3GkTnl3ncdjw5ia9k7T5lJqfSPYhClwfuQRmt9PTCWnyh5YhP6glufMYknMveOMLDIHYf7N_ug8ic-6XIQO-K-5qQSTVS4_k5yRknEuw7