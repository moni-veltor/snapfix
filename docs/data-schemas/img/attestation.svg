="834.7822" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="14" lengthAdjust="spacing" textLength="66.582" x="1132.26" y="838.1289">id : string</text><line style="stroke:#181818;stroke-width:1;" x1="1113.26" x2="1642.8664" y1="845.4306" y2="845.4306"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="1123.26" cy="859.0791" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="14" lengthAdjust="spacing" textLength="143.1719" x="1132.26" y="862.4257">attestationId : string</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="14" lengthAdjust="spacing" textLength="99.333" x="1132.26" y="878.7226">sequence : int</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="14" lengthAdjust="spacing" textLength="505.6064" x="1132.26" y="895.0195">hash : string  // SHA-256 of prevHash || canonical(payload) || timestamp</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="14" lengthAdjust="spacing" textLength="346.3633" x="1132.26" y="911.3164">prevHash : string  // 64 zero-chars on sequence 0</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="14" lengthAdjust="spacing" textLength="98.1504" x="1132.26" y="927.6132">payload : Json</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="14" lengthAdjust="spacing" textLength="158.6826" x="1132.26" y="943.9101">occurredAt : DateTime</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="93" id="ent0012"><path d="M2030.16,830.1869 L2030.16,915.8509 L2321.9637,915.8509 L2321.9637,840.1869 L2311.9637,830.1869 L2030.16,830.1869" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2311.9637,830.1869 L2311.9637,840.1869 L2321.9637,840.1869 L2311.9637,830.1869" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="252.8716" x="2036.16" y="847.2538">Firm-wide annual roll-up. snapshotJson</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="270.8037" x="2036.16" y="862.3866">freezes IBS register + tolerances + 12mo</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="245.7305" x="2036.16" y="877.5194">testing + open action items + vendor</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="220.5303" x="2036.16" y="892.6522">criticality at sign-off. retainUntilAt</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="203.5439" x="2036.16" y="907.785">enforces 6-year retention floor.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="101" id="ent0015"><path d="M768.55,837.7569 L768.55,869.2469 L733.52,873.2469 L768.55,877.2469 L768.55,908.2881 A0,0 0 0 0 768.55,908.2881 L1077.5686,908.2881 A0,0 0 0 0 1077.5686,908.2881 L1077.5686,847.7569 L1067.5686,837.7569 L768.55,837.7569 A0,0 0 0 0 768.55,837.7569" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1067.5686,837.7569 L1067.5686,847.7569 L1077.5686,847.7569 L1067.5686,837.7569" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="264.8242" x="774.55" y="854.8238">Logged during the year when something</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="285.2319" x="774.55" y="869.9566">changes that could undermine the standing</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="288.0186" x="774.55" y="885.0894">assertion. Review outcome decides whether</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="144.3267" x="774.55" y="900.2222">to re-attest mid-cycle.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="108" id="ent0018"><path d="M1678.96,845.3169 L1678.96,869.2469 L1644.07,873.2469 L1678.96,877.2469 L1678.96,900.7153 A0,0 0 0 0 1678.96,900.7153 L1995.1704,900.7153 A0,0 0 0 0 1995.1704,900.7153 L1995.1704,855.3169 L1985.1704,845.3169 L1678.96,845.3169 A0,0 0 0 0 1678.96,845.3169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1985.1704,845.3169 L1985.1704,855.3169 L1995.1704,855.3169 L1985.1704,845.3169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="295.2104" x="1684.96" y="862.3838">Mirrors ExerciseAuditHashEntry. A supervisor</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="242.9946" x="1684.96" y="877.5166">can re-walk the chain offline to verify</text><text fill="#000000" font-family="'Inter, system-ui, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="111.8838" x="1684.96" y="892.6494">sign-off integrity.</text></g><!--link Org to Att--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="86" id="lnk6"><path codeLine="86" d="M1033.31,160.2169 C1033.31,177.4569 1033.31,171.7369 1033.31,193.4569" fill="none" id="Org-Att" style="stroke:#6366F1;stroke-width:1;"/><line style="stroke:#6366F1;stroke-width:1;" x1="1029.31" x2="1037.31" y1="156.2169" y2="156.2169"/><line style="stroke:#6366F1;stroke-width:1;" x1="1029.31" x2="1037.31" y1="159.2169" y2="159.2169"/><line style="stroke: